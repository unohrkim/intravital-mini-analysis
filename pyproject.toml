[project]
name = "intravital-mini-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tensorflow>=2.21.0",
    "tifffile>=2026.8.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
